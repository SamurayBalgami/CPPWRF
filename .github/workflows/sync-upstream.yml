# Keeps this fork's main up to date with Xassemblianist/CPPWRF: merges upstream main into main every
# 15 minutes (and on demand from the Actions tab), so the fork is upstream's latest plus its own fixes.
# A merge conflict fails the run (GitHub e-mails the failure) and leaves main as it was; resolve it
# locally and push.
name: Sync upstream

on:
  schedule:
    - cron: "7,22,37,52 * * * *"  # off the busy :00 / :15 marks, where GitHub delays or drops scheduled runs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Merge upstream main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch https://github.com/Xassemblianist/CPPWRF.git main
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "Already up to date with upstream."
            exit 0
          fi
          git merge --no-edit -m "Merge Xassemblianist/CPPWRF main" FETCH_HEAD
          git push origin HEAD:main
