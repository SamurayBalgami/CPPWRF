# Keeps this fork's main up to date with Xassemblianist/CPPWRF: merges upstream main into main every
# 15 minutes (and on demand from the Actions tab), so the fork is upstream's latest plus its own fixes.
# A merge conflict leaves main as it was and opens an issue (one at a time); resolve it locally and push.
name: Sync upstream

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Merge upstream main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch https://github.com/Xassemblianist/CPPWRF.git main
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "Already up to date with upstream."
            exit 0
          fi
          git merge --no-edit -m "Merge Xassemblianist/CPPWRF main" FETCH_HEAD
          git push origin HEAD:main
      - name: Report a failed sync
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Sync upstream failed (merge conflict?)"
          if [ -z "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')" ]; then
            gh issue create --title "$title" \
              --body "Merging Xassemblianist/CPPWRF main into main failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. main was left as it was."
          fi
