# V2 (Svalbard) with fractional sea ice (fractional_seaice = 1; real.exe run again with it: 2548 points with
# 0.02 <= XICE < 1) against the WRF run F1_r8 (real*8, 3 h; steps/: history every step).
[run]
case = real
run_time = 300
[real]
dir = ${CPPWRF_WRF_RUNS}/run_F1_r8/steps
[time]
dt = 60
[dyn]
khdif = 0
kvdif = 0
diff_opt = 1
km_opt = 4
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
moist_adv_opt = 1
scalar_adv_opt = 1
[moist]
species = qv,qc,qr,qi,qs,qg
[phys]
mp_physics = 6
sf_sfclay_physics = 1
sf_surface_physics = 2
bl_pbl_physics = 1
num_soil_layers = 4
cu_physics = 1
cudt = 0
ra_lw_physics = 4
ra_sw_physics = 4
radt = 1
fractional_seaice = 1
[output]
diag_interval = 1
out_interval = 1
