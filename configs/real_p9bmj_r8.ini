# P9 (Eta MYJSFC + Noah + MYJ PBL) with the Betts-Miller-Janjic cumulus (cu_physics = 2, BMJ's use with MYJ / Eta in
# WRF), against the WRF run P9BMJ_r8 (stock WRF v4.8.0 real*8 build of run_P9_r8's inputs with cu_physics = 2;
# steps/ = history every step). BMJ is column_verified (data/option_tiers.txt): allow_unverified until this case
# proves it.
[run]
case = real
run_time = 180
[cppwrf]
allow_unverified = true
[real]
dir = ${CPPWRF_WRF_RUNS}/run_P9BMJ_r8/steps
[time]
dt = 60
[dyn]
khdif = 0
kvdif = 0
moist_adv_opt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
[moist]
species = qv
[phys]
sf_sfclay_physics = 2
sf_surface_physics = 2
bl_pbl_physics = 2
cu_physics = 2
num_soil_layers = 4
[output]
diag_interval = 1
out_interval = 1
