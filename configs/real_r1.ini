# Real-data dry dycore check against the WRF run R1_r8 (WRF v4.8.0 real*8, same
# wrfinput/wrfbdy, physics/diffusion/damping off, dt = 60 s, output every step, 5 min).
[run]
case = real
run_time = 300
[real]
dir = ${CPPWRF_WRF_RUNS}/run_R1_r8
[time]
dt = 60
[dyn]
khdif = 0
kvdif = 0
moist_adv_opt = 1
[moist]
species = qv
[output]
diag_interval = 1
out_interval = 1
