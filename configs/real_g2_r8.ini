# P2 with gravity wave drag (gwd_opt = 1, GWDO) against the WRF run G2_r8 (real*8, 3 h; steps/: history
# every step). WPS 4.6 writes no ELVMAX, so the G2 wrfinput sets ELVMAX = HGT + 3 VAR.
[run]
case = real
run_time = 180
[real]
dir = ${CPPWRF_WRF_RUNS}/run_G2_r8/steps
[time]
dt = 60
[dyn]
khdif = 0
kvdif = 0
moist_adv_opt = 1
w_damping = 1
damp_opt = 3
gwd_opt = 1
zdamp = 5000
dampcoef = 0.2
[moist]
species = qv
[phys]
sf_sfclay_physics = 1
sf_surface_physics = 2
bl_pbl_physics = 1
cu_physics = 1
cudt = 0
num_soil_layers = 4
[output]
diag_interval = 1
out_interval = 1
