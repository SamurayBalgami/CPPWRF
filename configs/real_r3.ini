# Real-data dry dycore with hybrid_opt = 2, w_damping = 1 and damp_opt = 3 (zdamp 5 km,
# dampcoef 0.2) against the WRF run R3 (FP32).
[run]
case = real
run_time = 3600
[real]
dir = ${CPPWRF_WRF_RUNS}/run_R3
[time]
dt = 60
[dyn]
khdif = 0
kvdif = 0
moist_adv_opt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
[moist]
species = qv
[output]
diag_interval = 10
out_interval = 10
