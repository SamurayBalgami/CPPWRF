# Real-data dry dycore with diff_opt = 2, km_opt = 2 (1.5-order TKE) against the WRF run
# T1 = R1_r8 + diff_opt = 2, km_opt = 2 (WRF v4.6.1 real*8, dt = 60 s, output every step, 5 min).
[run]
case = real
run_time = 300
[real]
dir = ${CPPWRF_WRF_RUNS}/run_R1_r8
[time]
dt = 60
[dyn]
diff_opt = 2
km_opt = 2
khdif = 0
kvdif = 0
moist_adv_opt = 1
tke_adv_opt = 1
[phys]
isfflx = 0
[moist]
species = qv
[output]
diag_interval = 1
out_interval = 1
