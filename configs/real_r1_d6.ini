# R1 + diff_opt = 1, km_opt = 4 (2-D Smagorinsky), diff_6th_opt = 2 (monotonic sixth-order
# diffusion of u, v, w, theta and qv), damp_opt = 1 (cal_dampkm) against the WRF run R1D6_r8
# (WRF v4.8.0 real*8, the R1 wrfinput/wrfbdy and namelist with these four options, 10 min).
[run]
case = real
run_time = 600
[real]
dir = ${CPPWRF_WRF_RUNS}/run_R1_r8
[time]
dt = 60
[dyn]
khdif = 0
kvdif = 0
diff_opt = 1
km_opt = 4
diff_6th_opt = 2
diff_6th_factor = 0.12
damp_opt = 1
zdamp = 5000
dampcoef = 0.2
moist_adv_opt = 1
[moist]
species = qv
[output]
diag_interval = 1
out_interval = 1
