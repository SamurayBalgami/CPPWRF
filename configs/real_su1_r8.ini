# D0V (WRF v4.8.0's default real-data namelist on the V2 domain, configs/real_d0v_r8.ini) with sst_update = 1:
# SST, SEAICE, VEGFRA, ALBBCK, LAI from wrflowinp_d01 (cppwrf_real / real.exe) every auxinput4_interval
# (360 min), with the water/ice transitions of WRF's surface driver, against the WRF run SU1_r8 (real*8
# -double-8, 7 h, history every 30 min, the 6 h update included; steps/: history every step for 20 min).
# tools/wrf2cppwrf.py gives this configuration from that namelist.
[run]
case = real
run_time = 1200
[real]
dir = ${CPPWRF_WRF_RUNS}/run_SU1_r8/steps
[time]
dt = 60
[dyn]
khdif = 0
kvdif = 0
gwd_opt = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
diff_opt = 2
km_opt = 4
moist_adv_opt = 1
scalar_adv_opt = 1
[moist]
species = qv,qc,qr,qi,qs,qg,qni,qnr
[phys]
mp_physics = 8
sf_sfclay_physics = 2
sf_surface_physics = 2
bl_pbl_physics = 2
cu_physics = 6
ra_lw_physics = 4
ra_sw_physics = 4
radt = 15
num_soil_layers = 4
fractional_seaice = 1
sst_update = 1
auxinput4_interval = 360
[output]
diag_interval = 1
out_interval = 1
