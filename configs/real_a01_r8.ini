# A01: P1 (sfclayrev + Noah + YSU) with usemonalb = .true. (ALBBCK of wrfinput, SNOALB on snow) and rdlai2d = .true.
# (Noah's LAI from wrfinput), inputs of the WRF run P1_r8; reference WRF run A01_r8 (real*8; steps/ = history every step).
[run]
case = real
run_time = 180
[real]
dir = ${CPPWRF_WRF_RUNS}/run_P1_r8/steps
[time]
dt = 60
[dyn]
khdif = 0
kvdif = 0
moist_adv_opt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
[moist]
species = qv
[phys]
sf_sfclay_physics = 1
sf_surface_physics = 2
bl_pbl_physics = 1
num_soil_layers = 4
usemonalb = true
rdlai2d = true
[output]
diag_interval = 1
out_interval = 1
