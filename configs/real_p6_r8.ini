# P6: P1 column physics + Thompson (mp_physics = 8) + diff_opt 1 / km_opt 4 on the P5 inputs; WRF
# reference built with -fdefault-real-8 -fdefault-double-8 (~/wrf_real/WRF-4.6.1-r8d8: the stock -r8 build
# makes Thompson's DOUBLE PRECISION quad). Thompson tables read from WRF's qr_acr_qg_V4.dat etc. in real.dir.
[run]
case = real
run_time = 180
[real]
dir = /home/ostriquetrum/wrf_real/run_P6_r8/steps
[time]
dt = 60
[dyn]
khdif = 0
kvdif = 0
diff_opt = 1
km_opt = 4
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
moist_adv_opt = 1
scalar_adv_opt = 1
[moist]
species = qv,qc,qr,qi,qs,qg,qni,qnr
[phys]
mp_physics = 8
sf_sfclay_physics = 1
sf_surface_physics = 2
bl_pbl_physics = 1
num_soil_layers = 4
[output]
diag_interval = 1
out_interval = 1
