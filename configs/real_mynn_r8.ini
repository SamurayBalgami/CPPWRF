# MYNN: P6 (Thompson + Noah + diff_opt 1 / km_opt 4) with the MYNN surface layer (sf_sfclay_physics = 5), the
# MYNN-EDMF PBL (bl_pbl_physics = 5, WRF's default bl_mynn_* options, icloud_bl = 1) and RRTMG LW/SW every 10 min
# (radt = 10, the subgrid clouds of icloud_bl in the radiation), against the WRF run MYNN_r8 (real*8 -double-8,
# 1 h, history every 10 min; steps/: history every step for 3 steps; tools/gcp/gcp_wrfref.sh). tools/wrf2cppwrf.py
# gives this configuration from that namelist (real.dir as ${CPPWRF_WRF_RUNS}; the tables are read from real.dir).
[run]
case = real
run_time = 180

[real]
dir = ${CPPWRF_WRF_RUNS}/run_MYNN_r8/steps
p_top_requested = 5000
iso_temp = 200
dx = 15000
dy = 15000
wrfinput = wrfinput_d01
wrfbdy = wrfbdy_d01

[time]
dt = 60

[dyn]
khdif = 0
kvdif = 0
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
diff_opt = 1
km_opt = 4
moist_adv_opt = 1
scalar_adv_opt = 1
hybrid_opt = 2

[moist]
species = qv,qc,qr,qi,qs,qg,qni,qnr

[phys]
mp_physics = 8
sf_sfclay_physics = 5
sf_surface_physics = 2
bl_pbl_physics = 5
cu_physics = 0
ra_lw_physics = 4
ra_sw_physics = 4
radt = 10
num_soil_layers = 4

[restart]
interval = 86400

[output]
diag_interval = 1
out_interval = 1
