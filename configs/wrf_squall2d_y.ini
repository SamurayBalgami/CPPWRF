# WRF v4.8.0 em_squall2d_y (ideal_case = 5) initialized by the port of WRF's ideal.exe
# (src/cases/wrf_ideal.cpp): namelist of the reference run ${CPPWRF_WRF_REF}/run_squall2d_kessler
# (e_we = 3, e_sn = 202, e_vert = 81, dx = 250, ztop = 20000, dt = 3, open_ys = open_ye = .true.,
# periodic_x, Kessler, diff_opt 2 / km_opt 2 (TKE), damp_opt 2, mix_full_fields, positive-definite
# moist/scalar/TKE advection).
[run]
case = em_squall2d_y
run_time = 600
[domain]
nx = 2
ny = 201
nz = 80
dx = 250
dy = 250
ztop = 20000
bc_x = periodic
bc_y = open
[case]
sounding_file = ${CPPWRF_WRF_REF}/run_squall2d_kessler/input_sounding
[time]
dt = 3
time_step_sound = 6
[dyn]
hybrid_opt = 0
diff_opt = 2
km_opt = 2
damp_opt = 2
dampcoef = 0.003
zdamp = 5000
khdif = 300
kvdif = 1
smdiv = 0.1
emdiv = 0.01
epssm = 0.1
h_adv_order = 5
v_adv_order = 3
mix_full_fields = true
moist_adv_opt = 1
scalar_adv_opt = 1
tke_adv_opt = 1
[moist]
species = qv, qc, qr
[phys]
mp_physics = 1
[output]
diag_interval = 20
out_interval = 200
