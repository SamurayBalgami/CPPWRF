# WRF v4.8.0 em_grav2d_x (ideal_case = 6, Straka density current) with symmetric_xs/xe (rigid walls)
# instead of periodic_x, initialized by the port of WRF's ideal.exe: reference run
# ${CPPWRF_WRF_REF}/r8/run_grav2d_x_sym (otherwise the namelist of run_straka_d1).
[run]
case = em_grav2d_x
run_time = 900
[domain]
nx = 512
ny = 1
nz = 64
dx = 100
dy = 100
ztop = 6409
bc_x = symmetric
bc_y = periodic
[case]
sounding_file = ${CPPWRF_WRF_REF}/r8/run_grav2d_x_sym/input_sounding
[time]
dt = 1
time_step_sound = 6
[dyn]
hybrid_opt = 0
diff_opt = 1
km_opt = 1
khdif = 75
kvdif = 75
[moist]
species = qv
[output]
diag_interval = 10
out_interval = 300
