# Bryan & Fritsch (2002) dry rising thermal, x-z, 20 km x 10 km, dx = dz = 100 m, 1000 s.
# Rigid (symmetric) lateral walls.
[run]
case = warm_bubble
run_time = 1000
[domain]
nx = 200
ny = 1
nz = 100
dx = 100
ztop = 10000
bc_x = symmetric
eta = uniform_z
[time]
dt = 1
[dyn]
khdif = 0
kvdif = 0
[output]
diag_interval = 10
out_interval = 250
