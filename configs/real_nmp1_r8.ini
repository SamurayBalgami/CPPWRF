# Real data with the NMP1 column physics (sfclayrev + Noah-MP v5.1.2 + YSU), hybrid_opt = 2,
# w_damping = 1, damp_opt = 3, no diffusion, against the WRF v4.8.0 run NMP1_r8 (real*8; steps/ = history every step).
[run]
case = real
run_time = 180
[real]
dir = ${CPPWRF_WRF_RUNS}/run_NMP1_r8/steps
[time]
dt = 60
[dyn]
khdif = 0
kvdif = 0
moist_adv_opt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
[moist]
species = qv
[phys]
sf_sfclay_physics = 1
sf_surface_physics = 4
bl_pbl_physics = 1
num_soil_layers = 4
[output]
diag_interval = 1
out_interval = 1
