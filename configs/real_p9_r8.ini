# Real data with the P9 column physics (Eta MYJSFC + Noah + MYJ PBL), hybrid_opt = 2, w_damping = 1,
# damp_opt = 3, no diffusion, against the WRF run P9_r8 (stock WRF v4.6.1 real*8 build; steps/ = history every step).
[run]
case = real
run_time = 180
[real]
dir = ${CPPWRF_WRF_RUNS}/run_P9_r8/steps
[time]
dt = 60
[dyn]
khdif = 0
kvdif = 0
moist_adv_opt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
[moist]
species = qv
[phys]
sf_sfclay_physics = 2
sf_surface_physics = 2
bl_pbl_physics = 2
num_soil_layers = 4
[output]
diag_interval = 1
out_interval = 1
