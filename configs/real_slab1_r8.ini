# SLAB1: the P1 configuration with the 5-layer thermal diffusion land surface (sf_surface_physics = 1) instead of
# Noah: WRF v4.8.0 real*8 run ${CPPWRF_WRF_RUNS}/run_SLAB1_r8 from real.exe's 5-layer input (steps/ = 3 minutes,
# history every step).
[run]
case = real
run_time = 180
[real]
dir = ${CPPWRF_WRF_RUNS}/run_SLAB1_r8/steps
[time]
dt = 60
[dyn]
khdif = 0
kvdif = 0
moist_adv_opt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
[moist]
species = qv
[phys]
sf_sfclay_physics = 1
sf_surface_physics = 1
bl_pbl_physics = 1
num_soil_layers = 5
[output]
diag_interval = 1
out_interval = 1
