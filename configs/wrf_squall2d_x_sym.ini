# WRF v4.8.0 em_squall2d_x (ideal_case = 4) with symmetric_xs/xe instead of open_xs/xe and the sounding
# without wind, initialized by the port of WRF's ideal.exe: reference run ${CPPWRF_WRF_REF}/r8/run_squall2d_x_sym
# (otherwise the namelist of run_squall2d_kessler_10min: Kessler, diff_opt 2 / km_opt 2, PD advection).
[run]
case = em_squall2d_x
run_time = 600
[domain]
nx = 201
ny = 1
nz = 80
dx = 250
dy = 250
ztop = 20000
bc_x = symmetric
bc_y = periodic
[case]
sounding_file = ${CPPWRF_WRF_REF}/r8/run_squall2d_x_sym/input_sounding
[time]
dt = 3
time_step_sound = 6
[dyn]
hybrid_opt = 0
diff_opt = 2
km_opt = 2
damp_opt = 2
dampcoef = 0.003
zdamp = 5000
khdif = 300
kvdif = 1
smdiv = 0.1
emdiv = 0.01
epssm = 0.1
h_adv_order = 5
v_adv_order = 3
mix_full_fields = true
moist_adv_opt = 1
scalar_adv_opt = 1
tke_adv_opt = 1
[moist]
species = qv, qc, qr
[phys]
mp_physics = 1
[output]
diag_interval = 20
out_interval = 200
