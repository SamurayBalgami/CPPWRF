# Real data with the P1 column physics + RRTMG LW/SW radiation (radt = 1 min), against WRF run P3_r8.
[run]
case = real
run_time = 180
[real]
dir = /home/ostriquetrum/wrf_real/run_P3_r8/steps
[time]
dt = 60
[dyn]
khdif = 0
kvdif = 0
moist_adv_opt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
[moist]
species = qv
[phys]
sf_sfclay_physics = 1
sf_surface_physics = 2
bl_pbl_physics = 1
num_soil_layers = 4
ra_lw_physics = 4
ra_sw_physics = 4
radt = 1
rrtmg_tables = /home/ostriquetrum/wrf_real/rrtmg_tables
[output]
diag_interval = 1
out_interval = 1
