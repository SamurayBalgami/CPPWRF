# Inertial oscillation on an f-plane (Coriolis test): uniform u0 = 10 m/s, f = 1e-3 1/s, no
# pressure gradients (periodic, horizontally uniform), so u = u0 cos(f t), v = -u0 sin(f t).
# Period 2 pi / f = 6283.2 s; snapshots every 1570 s (~ quarter period).
[run]
case = rest_state
run_time = 6280
[domain]
nx = 8
ny = 8
nz = 20
dx = 2000
dy = 2000
ztop = 20000
bc_x = periodic
bc_y = periodic
eta = uniform_z
f0 = 1e-3
[case]
u0 = 10
[time]
dt = 10
[dyn]
khdif = 0
kvdif = 0
[output]
diag_interval = 10
out_interval = 157
