# A05C: P4 with cldovrlp = 0: RRTMG LW / SW without clouds (mcica_subcol_lw/_sw return at once, every column
# takes the clear path; CLDFRA is still cal_cldfra1's); WRF v4.8.0 real*8 reference run
# ${CPPWRF_WRF_RUNS}/run_A05C_r8 (inputs of run_P4_r8; steps/ = 3 minutes, history every step).
[run]
case = real
run_time = 180
[real]
dir = ${CPPWRF_WRF_RUNS}/run_A05C_r8/steps
[time]
dt = 60
[dyn]
khdif = 0
kvdif = 0
diff_opt = 1
km_opt = 4
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
moist_adv_opt = 1
scalar_adv_opt = 1
[moist]
species = qv,qc,qr,qi,qs,qg
[phys]
mp_physics = 6
sf_sfclay_physics = 1
sf_surface_physics = 2
bl_pbl_physics = 1
num_soil_layers = 4
cu_physics = 1
cudt = 0
ra_lw_physics = 4
ra_sw_physics = 4
radt = 1
cldovrlp = 0
[output]
diag_interval = 1
out_interval = 1
