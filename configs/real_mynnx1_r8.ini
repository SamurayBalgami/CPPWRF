# MYNNX1: P6 (Thompson + Noah + diff_opt 1 / km_opt 4) with the MYNN-EDMF PBL and the MYNN surface layer
# (bl_pbl_physics = 5, sf_sfclay_physics = 5) and RRTMG LW/SW every 10 min, from the run_P6_r8 inputs, with
# non-default MYNN options: bl_mynn_tkeadvect (QKE from the advected scalar qke_adv), bl_mynn_cloudpdf 1,
# bl_mynn_mixlength 2, bl_mynn_closure 3.0, bl_mynn_edmf_tke 1, bl_mynn_mixqt 1, bl_mynn_output 1, tke_budget 1,
# sf_mynn_sfcflux_land 2, sf_mynn_sfcflux_water 3 and grav_settling 2. WRF v4.8.0 real*8 -double-8 reference
# wrfout files in ${CPPWRF_WRF_RUNS}/run_MYNNX1_r8 (1 h, history every 10 min; steps/: 3 minutes, every step).
[run]
case = real
run_time = 180

[real]
dir = ${CPPWRF_WRF_RUNS}/run_P6_r8/steps

[time]
dt = 60

[dyn]
khdif = 0
kvdif = 0
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
diff_opt = 1
km_opt = 4
moist_adv_opt = 1
scalar_adv_opt = 1
hybrid_opt = 2

[moist]
species = qv,qc,qr,qi,qs,qg,qni,qnr

[phys]
mp_physics = 8
sf_sfclay_physics = 5
sf_surface_physics = 2
bl_pbl_physics = 5
cu_physics = 0
ra_lw_physics = 4
ra_sw_physics = 4
radt = 10
num_soil_layers = 4
bl_mynn_tkeadvect = true
bl_mynn_cloudpdf = 1
bl_mynn_mixlength = 2
bl_mynn_closure = 3.0
bl_mynn_edmf_tke = 1
bl_mynn_mixqt = 1
bl_mynn_output = 1
tke_budget = 1
sf_mynn_sfcflux_land = 2
sf_mynn_sfcflux_water = 3
grav_settling = 2

[output]
diag_interval = 1
out_interval = 1
