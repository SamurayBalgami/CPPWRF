# V1: Tropics (Bay of Bengal), Mercator, 15 km, P4 physics (sfclayrev + Noah + YSU + KF + WSM6 + RRTMG, radt = 1), 6 h
# from GFS 2026-10-12 00 UTC; WRF v4.8.0 real*8 reference ${CPPWRF_WRF_RUNS}/run_V1_r8.
[run]
case = real
run_time = 21600
[real]
dir = ${CPPWRF_WRF_RUNS}/run_V1_r8
[time]
dt = 60
[dyn]
khdif = 0
kvdif = 0
diff_opt = 1
km_opt = 4
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
moist_adv_opt = 1
scalar_adv_opt = 1
[moist]
species = qv,qc,qr,qi,qs,qg
[phys]
mp_physics = 6
sf_sfclay_physics = 1
sf_surface_physics = 2
bl_pbl_physics = 1
num_soil_layers = 4
cu_physics = 1
cudt = 0
ra_lw_physics = 4
ra_sw_physics = 4
radt = 1
[output]
diag_interval = 60
out_interval = 60
