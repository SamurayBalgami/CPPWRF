# Thompson microphysics (mp_physics = 8) on real data: WRF v4.8.0 real*8 run
# ${CPPWRF_WRF_RUNS}/run_mp8_r8/steps (from run_mp6_r8/steps inputs, mp_physics = 8), 3 steps at dt = 60 s.
[run]
case = real
run_time = 180
[real]
dir = ${CPPWRF_WRF_RUNS}/run_mp8_r8/steps
[time]
dt = 60
[dyn]
khdif = 0
kvdif = 0
moist_adv_opt = 1
scalar_adv_opt = 1
[moist]
species = qv,qc,qr,qi,qs,qg,qni,qnr
[phys]
mp_physics = 8
[output]
diag_interval = 1
out_interval = 1
