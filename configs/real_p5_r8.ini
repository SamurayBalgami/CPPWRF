# P1 column physics + WSM6 + diff_opt 1 / km_opt 4 (no cumulus, no radiation): the WRF
# v4.8.0 real*8 run ${CPPWRF_WRF_RUNS}/run_P5_r8 (run_P4_r8 inputs, ra/cu off), history every step.
[run]
case = real
run_time = 180
[real]
dir = ${CPPWRF_WRF_RUNS}/run_P5_r8
[time]
dt = 60
[dyn]
khdif = 0
kvdif = 0
diff_opt = 1
km_opt = 4
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
moist_adv_opt = 1
scalar_adv_opt = 1
[moist]
species = qv,qc,qr,qi,qs,qg
[phys]
mp_physics = 6
sf_sfclay_physics = 1
sf_surface_physics = 2
bl_pbl_physics = 1
num_soil_layers = 4
[output]
diag_interval = 1
out_interval = 1
