# KM3: P4 with diff_opt = 2 / km_opt = 3 (3-D Smagorinsky: Km from the 3-D deformation, horizontal and
# vertical; the YSU PBL does the vertical mixing of the scalars and momentum).
# WRF v4.8.0 real*8 reference run ${CPPWRF_WRF_RUNS}/run_KM3_r8 (inputs of run_P4_r8; steps/ = 3 minutes, history
# every step; tools/colab/colab_wrfref.sh). On this 15 km domain WRF itself is unstable with this configuration
# (horizontal Km from the vertical shear, at its mix_upper_bound cap, with the diff_opt 2 stress terms): max|U| is
# 256 m/s after the second step and every field is NaN after the third, which WRF does not stop on. The suite
# compares the first two steps (identical, the growing instability included); KM3H (real_km3h_r8.ini) runs km_opt 3
# for 1 h with diff_opt 1.
[run]
case = real
run_time = 120
[real]
dir = ${CPPWRF_WRF_RUNS}/run_KM3_r8/steps
[time]
dt = 60
[dyn]
khdif = 0
kvdif = 0
diff_opt = 2
km_opt = 3
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
moist_adv_opt = 1
scalar_adv_opt = 1
[moist]
species = qv,qc,qr,qi,qs,qg
[phys]
mp_physics = 6
sf_sfclay_physics = 1
sf_surface_physics = 2
bl_pbl_physics = 1
num_soil_layers = 4
cu_physics = 1
cudt = 0
ra_lw_physics = 4
ra_sw_physics = 4
radt = 1
[output]
diag_interval = 1
out_interval = 1
