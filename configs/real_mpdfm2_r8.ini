# MPDFM2: MYNN with bl_mynn_cloudpdf = -2 (the Chaboureau-Bechtold PDF of cloudpdf 2, then the subgrid
# clouds zeroed).
# WRF v4.8.0 real*8 -double-8 reference run ${CPPWRF_WRF_RUNS}/run_MPDFM2_r8 (inputs of run_P6_r8, the MYNN_r8
# physics; 1 h, history every 10 min; steps/ = 3 minutes, history every step; tools/colab/colab_wrfref.sh).
[run]
case = real
run_time = 180

[real]
dir = ${CPPWRF_WRF_RUNS}/run_MPDFM2_r8/steps
p_top_requested = 5000
iso_temp = 200
dx = 15000
dy = 15000
wrfinput = wrfinput_d01
wrfbdy = wrfbdy_d01

[time]
dt = 60

[dyn]
khdif = 0
kvdif = 0
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
diff_opt = 1
km_opt = 4
moist_adv_opt = 1
scalar_adv_opt = 1
hybrid_opt = 2

[moist]
species = qv,qc,qr,qi,qs,qg,qni,qnr

[phys]
mp_physics = 8
sf_sfclay_physics = 5
sf_surface_physics = 2
bl_pbl_physics = 5
cu_physics = 0
ra_lw_physics = 4
ra_sw_physics = 4
radt = 10
num_soil_layers = 4
bl_mynn_cloudpdf = -2

[restart]
interval = 86400

[output]
diag_interval = 1
out_interval = 1
