# B01: P4 (Kain-Fritsch + WSM6 + RRTMG + diff_opt 1 / km_opt 4) with the adaptive time step (use_adaptive_time_step:
# starting step 60 s = 4 * dx / 1000, CFL targets 1.2 / 0.84, stepping to the history times), inputs of the WRF run
# P4_r8 (steps/: the same inputs); WRF v4.8.0 real*8 reference run ${CPPWRF_WRF_RUNS}/run_B01_r8 (steps/ = 3 minutes, history every minute).
[run]
case = real
run_time = 180
[real]
dir = ${CPPWRF_WRF_RUNS}/run_P4_r8/steps
[time]
dt = 60
adaptive = true
history_interval_s = 60
[dyn]
khdif = 0
kvdif = 0
diff_opt = 1
km_opt = 4
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
moist_adv_opt = 1
scalar_adv_opt = 1
[moist]
species = qv,qc,qr,qi,qs,qg
[phys]
mp_physics = 6
sf_sfclay_physics = 1
sf_surface_physics = 2
bl_pbl_physics = 1
num_soil_layers = 4
cu_physics = 1
cudt = 0
ra_lw_physics = 4
ra_sw_physics = 4
radt = 1
[output]
diag_interval = 1
out_interval = 1000000000
