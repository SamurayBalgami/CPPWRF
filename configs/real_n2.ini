# Real-data nested case N2 (two-way nesting, feedback = 1, 1 h run)
# d01: 119x89x44, dx = 15 km, dt = 60 s (out_interval = 10 -> every 600 s)
# d02: 120x90x44, dx = 5 km,  dt = 20 s (out_interval = 30 -> every 600 s)

[run]
case     = real
run_time = 3600.0

[real]
dir      = /home/ostriquetrum/wrf_real/run_N2
wrfinput = wrfinput_d01
wrfbdy   = wrfbdy_d01

[time]
dt              = 60.0
time_step_sound = 0

[dyn]
hybrid_opt     = 2
w_damping      = 1
damp_opt       = 3
zdamp          = 5000.0
dampcoef       = 0.2
diff_opt       = 0
km_opt         = 0
diff_6th_opt   = 0
khdif          = 0.0
kvdif          = 0.0
moist_adv_opt  = 1
scalar_adv_opt = 1
h_adv_order    = 5
v_adv_order    = 3
epssm          = 0.1
smdiv          = 0.1
emdiv          = 0.01

[moist]
species = qv

[phys]
mp_physics         = 0
sf_sfclay_physics  = 0
sf_surface_physics = 0
bl_pbl_physics     = 0
cu_physics         = 0

[output]
dir           = out/real_n2
format        = native
out_interval  = 10
diag_interval = 10

[domains]
max_dom                = 2
feedback               = 1
smooth_option          = 0
i_parent_start         = 40
j_parent_start         = 30
parent_grid_ratio      = 3
parent_time_step_ratio = 3

[d02]
wrfinput      = wrfinput_d02
dt            = 20.0
out_interval  = 30
diag_interval = 30
