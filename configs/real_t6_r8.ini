# P2 with the Tiedtke cumulus scheme (cu_physics = 6, physics_suite CONUS's cumulus) against the WRF run
# T6_r8 (real*8, 3 h, history every 30 min; steps/: history every step for 10 min).
[run]
case = real
run_time = 600
[real]
dir = ${CPPWRF_WRF_RUNS}/run_T6_r8/steps
[time]
dt = 60
[dyn]
khdif = 0
kvdif = 0
moist_adv_opt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
[moist]
species = qv
[phys]
sf_sfclay_physics = 1
sf_surface_physics = 2
bl_pbl_physics = 1
cu_physics = 6
cudt = 0
num_soil_layers = 4
[output]
diag_interval = 1
out_interval = 1
