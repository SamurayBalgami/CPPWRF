# RADT: P6 with do_radar_ref = 1 (Thompson's REFL_10CM at the history times), from the run_P6_r8 inputs. WRF
# v4.8.0 r8d8 reference wrfout files in ${CPPWRF_WRF_RUNS}/run_RADT_r8 (steps/ = 3 minutes, history every
# step). Thompson tables read from real.dir.
[run]
case = real
run_time = 180
[real]
dir = ${CPPWRF_WRF_RUNS}/run_P6_r8/steps
[time]
dt = 60
[dyn]
khdif = 0
kvdif = 0
diff_opt = 1
km_opt = 4
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
moist_adv_opt = 1
scalar_adv_opt = 1
[moist]
species = qv,qc,qr,qi,qs,qg,qni,qnr
[phys]
mp_physics = 8
do_radar_ref = 1
sf_sfclay_physics = 1
sf_surface_physics = 2
bl_pbl_physics = 1
num_soil_layers = 4
[output]
diag_interval = 1
out_interval = 1
