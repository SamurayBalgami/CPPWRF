# A08: P4 (Kain-Fritsch + WSM6 + RRTMG + diff_opt 1 / km_opt 4) with WRF's accumulation buckets and precipitation
# windows (diagnostic_output_calc): bucket_mm = 0.05 (RAINC / RAINNC above it at the first step: I_RAINC, I_RAINNC),
# bucket_J = 1e4 (the LW accumulations ACLW* at the first step: I_ACLW*), prec_acc_dt = 2 min (PREC_ACC_C,
# PREC_ACC_NC, SNOW_ACC_NC), inputs of the WRF run P4_r8 (steps/: the same inputs); WRF v4.8.0 real*8 reference run
# ${CPPWRF_WRF_RUNS}/run_A08_r8 (steps/ = 3 minutes, history every minute).
[run]
case = real
run_time = 180
[real]
dir = ${CPPWRF_WRF_RUNS}/run_P4_r8/steps
[time]
dt = 60
[dyn]
khdif = 0
kvdif = 0
diff_opt = 1
km_opt = 4
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
moist_adv_opt = 1
scalar_adv_opt = 1
[moist]
species = qv,qc,qr,qi,qs,qg
[phys]
mp_physics = 6
sf_sfclay_physics = 1
sf_surface_physics = 2
bl_pbl_physics = 1
num_soil_layers = 4
cu_physics = 1
cudt = 0
ra_lw_physics = 4
ra_sw_physics = 4
radt = 1
bucket_mm = 0.05
bucket_j = 1e4
prec_acc_dt = 2
[output]
diag_interval = 1
out_interval = 1
