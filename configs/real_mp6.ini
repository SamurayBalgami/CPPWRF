# Real data with WSM6 microphysics only (everything else off), against a WRF run with the same
# namelist (${CPPWRF_WRF_RUNS}/run_mp6: mp_physics = 6, 1 h, history every 10 min, FP32).
[run]
case = real
run_time = 3600
[real]
dir = ${CPPWRF_WRF_RUNS}/run_mp6
[time]
dt = 60
[dyn]
khdif = 0
kvdif = 0
moist_adv_opt = 1
[moist]
species = qv, qc, qr, qi, qs, qg
[phys]
mp_physics = 6
[output]
diag_interval = 10
out_interval = 10
