# WRF v4.8.0 em_quarter_ss (ideal_case = 2, Kessler) with symmetric lateral boundaries on all four sides
# (symmetric_xs/xe/ys/ye) and the sounding without wind (u = v = 0: WRF breaks down with a wind across the
# walls), initialized by the port of WRF's ideal.exe: reference run ${CPPWRF_WRF_REF}/r8/run_qss_sym
# (otherwise the namelist of run_qss with e_we = e_sn = 22: dx = 2000, dt = 12, diff_opt = 1, km_opt = 1,
# damp_opt = 3; the storm reaches the walls).
[run]
case = em_quarter_ss
run_time = 36
[domain]
nx = 21
ny = 21
nz = 40
dx = 2000
dy = 2000
ztop = 20000
bc_x = symmetric
bc_y = symmetric
[case]
sounding_file = ${CPPWRF_WRF_REF}/r8/run_qss_sym/input_sounding
[time]
dt = 12
time_step_sound = 6
[dyn]
hybrid_opt = 0
diff_opt = 1
km_opt = 1
khdif = 500
kvdif = 500
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
mix_full_fields = true
moist_adv_opt = 1
scalar_adv_opt = 1
[moist]
species = qv, qc, qr
[phys]
mp_physics = 1
[output]
diag_interval = 1
out_interval = 1
