# C01: P6 with the aerosol-aware Thompson (mp_physics = 28, aer_init_opt = 0: thompson_init's QNWFA / QNIFA
# profiles and QNWFA2D emission), inputs of the WRF run P6_r8 (steps/: the same inputs); WRF v4.8.0 r8d8 reference
# run ${CPPWRF_WRF_RUNS}/run_C01_r8 (steps/ = 3 minutes, history every minute). CCN_ACTIVATE.BIN and the Thompson
# tables are read from real.dir.
[run]
case = real
run_time = 180
[real]
dir = ${CPPWRF_WRF_RUNS}/run_P6_r8/steps
[time]
dt = 60
[dyn]
khdif = 0
kvdif = 0
diff_opt = 1
km_opt = 4
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
moist_adv_opt = 1
scalar_adv_opt = 1
[moist]
species = qv,qc,qr,qi,qs,qg,qni,qnr,qnc,qnwfa,qnifa,qnbca
[phys]
mp_physics = 28
sf_sfclay_physics = 1
sf_surface_physics = 2
bl_pbl_physics = 1
num_soil_layers = 4
[output]
diag_interval = 1
out_interval = 1
