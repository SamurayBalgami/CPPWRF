# MYNNX2: as MYNNX1 (P6 inputs, MYNN-EDMF PBL and MYNN surface layer, RRTMG every 10 min) with the other
# non-default MYNN options: bl_mynn_edmf 0, bl_mynn_cloudmix 0, bl_mynn_cloudpdf 0, bl_mynn_mixlength 0,
# bl_mynn_closure 2.5, bl_mynn_ess 0, bl_mynn_mixscalars 1, sf_mynn_sfcflux_land 3, sf_mynn_sfcflux_water 4 and
# grav_settling 1. WRF v4.8.0 real*8 -double-8 reference wrfout files in ${CPPWRF_WRF_RUNS}/run_MYNNX2_r8
# (1 h, history every 10 min; steps/: 3 minutes, every step).
[run]
case = real
run_time = 180

[real]
dir = ${CPPWRF_WRF_RUNS}/run_P6_r8/steps

[time]
dt = 60

[dyn]
khdif = 0
kvdif = 0
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
diff_opt = 1
km_opt = 4
moist_adv_opt = 1
scalar_adv_opt = 1
hybrid_opt = 2

[moist]
species = qv,qc,qr,qi,qs,qg,qni,qnr

[phys]
mp_physics = 8
sf_sfclay_physics = 5
sf_surface_physics = 2
bl_pbl_physics = 5
cu_physics = 0
ra_lw_physics = 4
ra_sw_physics = 4
radt = 10
num_soil_layers = 4
bl_mynn_edmf = 0
bl_mynn_cloudmix = 0
bl_mynn_cloudpdf = 0
bl_mynn_mixlength = 0
bl_mynn_closure = 2.5
bl_mynn_ess = 0
bl_mynn_mixscalars = 1
sf_mynn_sfcflux_land = 3
sf_mynn_sfcflux_water = 4
grav_settling = 1

[output]
diag_interval = 1
out_interval = 1
