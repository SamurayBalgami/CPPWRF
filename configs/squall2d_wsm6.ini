# Moist convection with WSM6 microphysics (ice, snow, graupel): Weisman & Klemp (1982) analytic sounding,
# 2 K warm bubble (10 km x 1.4 km radii), x-z, dx = 1 km, dz ~ 500 m, rigid lid at 20 km.
# No wind by default, so the storm must stay mirror-symmetric (a coupling test).
[run]
case = squall2d
run_time = 3600
[domain]
nx = 120
ny = 1
nz = 40
dx = 1000
ztop = 20000
bc_x = periodic
eta = uniform_z
[time]
dt = 6
[dyn]
khdif = 0
kvdif = 0
moist_adv_opt = 1
[moist]
species = qv, qc, qr, qi, qs, qg
[phys]
mp_physics = 6
[output]
diag_interval = 10
out_interval = 100
