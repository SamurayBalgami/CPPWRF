# Skamarock & Klemp (1994) nonhydrostatic inertia-gravity wave (f = 0), 300 km x 10 km,
# dx = dz = 1 km, U = 20 m/s, N = 0.01 1/s, 3000 s.
[run]
case = igw
run_time = 3000
[domain]
nx = 300
ny = 1
nz = 10
dx = 1000
ztop = 10000
bc_x = periodic
eta = uniform_z
[time]
dt = 6
[dyn]
khdif = 0
kvdif = 0
[output]
diag_interval = 10
out_interval = 250
