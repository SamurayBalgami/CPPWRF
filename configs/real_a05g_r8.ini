# A05G: P8 (Grell-Freitas, deep and shallow) with WSM6, RRTMG (radt = 1 min) and cu_rad_feedback = .true.:
# convtrans_prep's QC_CU / QI_CU (GD_CLOUD / GD_CLOUD2 averaged over convtrans_avglen_m) added to RRTMG's qc / qi
# before cal_cldfra1 (radiation_driver, icloud_cu = 1); WRF v4.8.0 real*8 reference run
# ${CPPWRF_WRF_RUNS}/run_A05G_r8 (inputs of run_P8_r8; steps/ = 3 minutes, history every step).
[run]
case = real
run_time = 180
[real]
dir = ${CPPWRF_WRF_RUNS}/run_A05G_r8/steps
[time]
dt = 60
[dyn]
khdif = 0
kvdif = 0
moist_adv_opt = 1
scalar_adv_opt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
[moist]
species = qv,qc,qr,qi,qs,qg
[phys]
mp_physics = 6
sf_sfclay_physics = 1
sf_surface_physics = 2
bl_pbl_physics = 1
cu_physics = 3
ishallow = 1
cudt = 0
num_soil_layers = 4
ra_lw_physics = 4
ra_sw_physics = 4
radt = 1
cu_rad_feedback = true
[output]
diag_interval = 1
out_interval = 1
