# Straka et al. (1993) density current, x-z, dx = dz = 100 m, K = 75 m2/s, 900 s.
# Full domain [-25.6, 25.6] km (bubble at the centre), ztop = 6.4 km.
[run]
case = straka
run_time = 900
[domain]
nx = 512
ny = 1
nz = 64
dx = 100
ztop = 6400
bc_x = periodic
eta = uniform_z
[time]
dt = 1
[dyn]
khdif = 75
kvdif = 75
# Straka et al. use the same K for theta; WRF diff_opt=1 would use 3K (1/prandtl)
pr_inv = 1
[output]
diag_interval = 10
out_interval = 300
