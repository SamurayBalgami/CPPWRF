# N3 steps (3 min, history every minute): two-way nest (d02 5 km, ratio 3, smooth_option 2) with the P4 physics
# (sfclayrev, Noah, YSU, Kain-Fritsch,
# WSM6, RRTMG LW/SW radt 1, diff_opt 1 / km_opt 4) on both domains, against the WRF run N3h_r8 (real*8, 1 h);
# run_N3s_r8: history every minute for 3 min. tools/wrf2cppwrf.py gives this configuration from that namelist.
[run]
case = real
run_time = 180

[real]
dir = ${CPPWRF_WRF_RUNS}/run_N3s_r8
wrfinput = wrfinput_d01
wrfbdy = wrfbdy_d01

[time]
dt = 60

[dyn]
khdif = 0
kvdif = 0
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
diff_opt = 1
km_opt = 4
moist_adv_opt = 1
scalar_adv_opt = 1

[moist]
species = qv,qc,qr,qi,qs,qg

[phys]
mp_physics = 6
sf_sfclay_physics = 1
sf_surface_physics = 2
bl_pbl_physics = 1
cu_physics = 1
ra_lw_physics = 4
ra_sw_physics = 4
radt = 1
num_soil_layers = 4
table_dir = ${CPPWRF_WRF_RUNS}/run_N3s_r8

[output]
dir = out/real_n3_steps
format = native
out_interval = 1
diag_interval = 1

[domains]
max_dom = 2
feedback = 1
smooth_option = 2
i_parent_start = 40
j_parent_start = 30
parent_grid_ratio = 3
parent_time_step_ratio = 3

[d02]
wrfinput = wrfinput_d02
dt = 20
out_interval = 3
diag_interval = 3
