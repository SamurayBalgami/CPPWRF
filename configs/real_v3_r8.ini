# V3: Alps, Lambert, 3 km convection-permitting (no cumulus), Thompson + MYJ + Eta surface layer +
# Noah-MP + RRTMG (radt = 5), dt = 18 s, 2 h; from GFS 2026-10-12 00 UTC. WRF v4.8.0 reference
# (-r8 -double-8, for Thompson's DOUBLE PRECISION) ${CPPWRF_WRF_RUNS}/run_V3_r8.
[run]
case = real
run_time = 7200
[real]
dir = ${CPPWRF_WRF_RUNS}/run_V3_r8
[time]
dt = 18
[dyn]
khdif = 0
kvdif = 0
diff_opt = 1
km_opt = 4
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
moist_adv_opt = 1
scalar_adv_opt = 1
[moist]
species = qv,qc,qr,qi,qs,qg,qni,qnr
[phys]
mp_physics = 8
sf_sfclay_physics = 2
sf_surface_physics = 4
bl_pbl_physics = 2
num_soil_layers = 4
cu_physics = 0
ra_lw_physics = 4
ra_sw_physics = 4
radt = 5
[output]
diag_interval = 100
out_interval = 100
