# Real data with the P8 column physics (sfclayrev + Noah + YSU + Grell-Freitas-Li cu_physics = 3, ishallow = 1), hybrid_opt = 2,
# w_damping = 1, damp_opt = 3, no diffusion, against WRF run P8_r8 (WRF-4.8.0-r8d8 build; steps/ = history every step).
[run]
case = real
run_time = 180
[real]
dir = ${CPPWRF_WRF_RUNS}/run_P8_r8/steps
[time]
dt = 60
[dyn]
khdif = 0
kvdif = 0
moist_adv_opt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
[moist]
species = qv
[phys]
sf_sfclay_physics = 1
sf_surface_physics = 2
bl_pbl_physics = 1
cu_physics = 3
ishallow = 1
cudt = 0
num_soil_layers = 4
[output]
diag_interval = 1
out_interval = 1
